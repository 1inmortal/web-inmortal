version: 2
updates:
  # Portfolio principal
  - package-ecosystem: "npm"
    directory: "/portfolio-react"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Monterrey"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5

  # Certificates App
